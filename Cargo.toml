[workspace]
resolver = "2"
members = ["crates/dusk-core", "crates/dusk-cli", "crates/dusk-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dusk-core = { path = "crates/dusk-core" }
core-foundation = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"
global-hotkey = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
